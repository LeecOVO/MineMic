<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 外部投影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- 青柠极光渐变：高亮黄绿 -> 深青 -> 深墨绿 -->
    <linearGradient id="innerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CCFF00" />   <!-- 高亮黄绿 -->
      <stop offset="45%" stop-color="#00B4D8" />  <!-- 深青 -->
      <stop offset="100%" stop-color="#0B1B1A" /> <!-- 深墨绿 -->
    </linearGradient>

    <!-- 内凹阴影（让内层像有厚度的玻璃面板） -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="6" />
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="shadow" />
      <feFlood flood-color="#000000" flood-opacity="0.65" />
      <feComposite in2="shadow" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>

    <!-- 挖空遮罩（圆润声波） -->
    <mask id="cutout">
      <rect width="512" height="512" fill="white" />
      <!-- Matches App WaveMark: heights .32/.68/1/.54/.26, stroke width / 8.5. -->
      <g transform="translate(112 112)" fill="black">
        <rect x="31.058824" y="97.920000" width="33.882353" height="92.160000" rx="16.941176" />
        <rect x="79.058824" y="46.080000" width="33.882353" height="195.840000" rx="16.941176" />
        <rect x="127.058824" y="0.000000" width="33.882353" height="288.000000" rx="16.941176" />
        <rect x="175.058824" y="66.240000" width="33.882353" height="155.520000" rx="16.941176" />
        <rect x="223.058824" y="106.560000" width="33.882353" height="74.880000" rx="16.941176" />
      </g>
    </mask>
  </defs>

  <!-- 外层背景 -->
  <rect width="512" height="512" rx="115" fill="#121215" filter="url(#dropShadow)" />

  <!-- 内层渐变 -->
  <g filter="url(#innerShadow)">
    <rect x="72" y="72" width="368" height="368" rx="64" fill="url(#innerGrad)" mask="url(#cutout)" />
  </g>

  <!-- 高光描边 -->
  <rect x="72" y="72" width="368" height="368" rx="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
</svg>
